<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 258" width="100%" role="img" aria-label="Bidding documents vs contract documents" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Bidding documents vs contract documents</title><defs><marker id="a-bidding-vs-contract-documents" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-bidding-vs-contract-documents" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><circle cx="135" cy="112" r="95" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><circle cx="225" cy="112" r="95" fill="#c8a24a" fill-opacity="0.12" stroke="#c8a24a" stroke-width="1.5"/><text x="80" y="56" text-anchor="middle" font-weight="700">BIDDING</text><text x="80" y="70" text-anchor="middle" font-weight="700">DOCUMENTS</text><text x="280" y="56" text-anchor="middle" font-weight="700">CONTRACT</text><text x="280" y="70" text-anchor="middle" font-weight="700">DOCUMENTS</text><text x="80" y="104" text-anchor="middle">invitation,</text><text x="80" y="118" text-anchor="middle">instructions</text><text x="80" y="132" text-anchor="middle">to bidders,</text><text x="80" y="146" text-anchor="middle">bid form</text><text x="180" y="100" text-anchor="middle">drawings,</text><text x="180" y="114" text-anchor="middle">specs,</text><text x="180" y="128" text-anchor="middle">addenda</text><text x="282" y="104" text-anchor="middle">agreement,</text><text x="282" y="118" text-anchor="middle">conditions,</text><text x="282" y="132" text-anchor="middle">change orders,</text><text x="282" y="146" text-anchor="middle">CCDs</text><text x="180" y="232" text-anchor="middle">Addenda are issued during bidding and</text><text x="180" y="248" text-anchor="middle">become part of the contract documents.</text></svg>