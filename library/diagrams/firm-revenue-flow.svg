<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 274" width="100%" role="img" aria-label="Firm revenue: gross to net to profit" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Firm revenue: gross to net to profit</title><defs><marker id="a-firm-revenue-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-firm-revenue-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><rect x="15" y="20" width="330" height="36" rx="4" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="180" y="43" text-anchor="middle" font-weight="700">GROSS REVENUE: all fees received</text><line x1="100" y1="56" x2="100" y2="86" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-firm-revenue-flow)"/><line x1="300" y1="56" x2="300" y2="86" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-firm-revenue-flow)"/><rect x="15" y="90" width="247.5" height="40" rx="4" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="138" y="107" text-anchor="middle" font-weight="700">NET REVENUE</text><text x="138" y="122" text-anchor="middle">gross minus pass-throughs</text><rect x="262.5" y="90" width="82.5" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="304" y="107" text-anchor="middle">Pass-</text><text x="304" y="121" text-anchor="middle">throughs</text><text x="304" y="148" text-anchor="middle">consultants,</text><text x="304" y="162" text-anchor="middle">reimbursables</text><line x1="138" y1="130" x2="138" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-firm-revenue-flow)"/><rect x="15" y="174" width="82" height="44" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="56" y="192" text-anchor="middle" font-weight="700">Direct</text><text x="56" y="207" text-anchor="middle">salary</text><rect x="97" y="174" width="124" height="44" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="159" y="192" text-anchor="middle" font-weight="700">Overhead</text><text x="159" y="207" text-anchor="middle">indirect expenses</text><rect x="221" y="174" width="41.5" height="44" fill="#c8a24a" fill-opacity="0.4" stroke="#c8a24a" stroke-width="1.5"/><text x="242" y="201" text-anchor="middle" font-weight="700">Profit</text><text x="15" y="246" text-anchor="start">Example: $3.00 of net revenue per $1.00 of direct salary</text><text x="15" y="262" text-anchor="start">= $1.00 salary + $1.50 overhead + $0.50 profit</text></svg>