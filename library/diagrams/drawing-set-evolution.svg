<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" width="100%" role="img" aria-label="Drawing sets from bid to as-constructed" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Drawing sets from bid to as-constructed</title><defs><marker id="a-drawing-set-evolution" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-drawing-set-evolution" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><rect x="15" y="16" width="150" height="28" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="23" y="35" text-anchor="start" font-weight="700">Construction drawings</text><text x="15" y="62" text-anchor="start">the bid set; a basic service</text><rect x="15" y="80" width="205" height="28" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><rect x="165" y="80" width="55" height="28" fill="#c8a24a" fill-opacity="0.4" stroke="#c8a24a" stroke-width="1.5"/><text x="23" y="99" text-anchor="start" font-weight="700">Conformed set</text><text x="15" y="126" text-anchor="start">+ addenda and accepted alternates</text><rect x="15" y="144" width="260" height="28" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><rect x="220" y="144" width="55" height="28" fill="#c8a24a" fill-opacity="0.4" stroke="#c8a24a" stroke-width="1.5"/><text x="23" y="163" text-anchor="start" font-weight="700">As-designed record</text><text x="15" y="190" text-anchor="start">+ change orders, ASIs, CCDs, minor changes</text><rect x="15" y="208" width="315" height="28" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><rect x="275" y="208" width="55" height="28" fill="#c8a24a" fill-opacity="0.4" stroke="#c8a24a" stroke-width="1.5"/><text x="23" y="227" text-anchor="start" font-weight="700">As-constructed record</text><text x="15" y="254" text-anchor="start">+ the contractor's field mark-ups</text><text x="180" y="274" text-anchor="middle">Each set adds to the one before it.</text></svg>