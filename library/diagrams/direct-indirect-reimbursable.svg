<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="100%" role="img" aria-label="Direct, indirect and reimbursable expenses" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Direct, indirect and reimbursable expenses</title><defs><marker id="a-direct-indirect-reimbursable" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-direct-indirect-reimbursable" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><rect x="250" y="16" width="96" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/><text x="298" y="42" text-anchor="middle" font-weight="700">Owner</text><rect x="14" y="16" width="96" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/><text x="62" y="35" text-anchor="middle" font-weight="700">Architect's</text><text x="62" y="49" text-anchor="middle" font-weight="700">office</text><line x1="246" y1="38" x2="114" y2="38" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-direct-indirect-reimbursable)"/><text x="180" y="32" text-anchor="middle">fee + reimbursables</text><line x1="62" y1="60" x2="62" y2="266" stroke="currentColor" stroke-width="1.5"/><rect x="90" y="92" width="260" height="44" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="100" y="110" text-anchor="start" font-weight="700">Direct expenses</text><text x="100" y="127" text-anchor="start">salaries of project staff, consultants</text><line x1="62" y1="114" x2="88" y2="114" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-direct-indirect-reimbursable)"/><rect x="90" y="142" width="260" height="44" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="100" y="160" text-anchor="start" font-weight="700">Indirect expenses (overhead)</text><text x="100" y="177" text-anchor="start">rent, admin staff, insurance, software</text><line x1="62" y1="164" x2="88" y2="164" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-direct-indirect-reimbursable)"/><rect x="90" y="192" width="260" height="44" rx="4" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="100" y="210" text-anchor="start" font-weight="700">Reimbursable expenses</text><text x="100" y="227" text-anchor="start">travel, prints: owner pays them back</text><line x1="62" y1="214" x2="88" y2="214" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-direct-indirect-reimbursable)"/><rect x="90" y="242" width="260" height="44" rx="4" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="1.5"/><text x="100" y="260" text-anchor="start" font-weight="700">Profit</text><text x="100" y="277" text-anchor="start">what remains after all expenses</text><line x1="62" y1="264" x2="88" y2="264" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-direct-indirect-reimbursable)"/></svg>