<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" width="100%" role="img" aria-label="CPM network: critical path and float" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>CPM network: critical path and float</title><defs><marker id="a-cpm-network-critical-path" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-cpm-network-critical-path" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><text x="180" y="22" text-anchor="middle" font-weight="700">Critical path A–B–D–F = 12 days</text><line x1="70" y1="145" x2="98" y2="72" stroke="#c8a24a" stroke-width="3" marker-end="url(#ag-cpm-network-critical-path)"/><line x1="70" y1="145" x2="98" y2="218" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-cpm-network-critical-path)"/><line x1="160" y1="72" x2="188" y2="72" stroke="#c8a24a" stroke-width="3" marker-end="url(#ag-cpm-network-critical-path)"/><line x1="160" y1="218" x2="188" y2="218" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-cpm-network-critical-path)"/><line x1="250" y1="72" x2="278" y2="145" stroke="#c8a24a" stroke-width="3" marker-end="url(#ag-cpm-network-critical-path)"/><line x1="250" y1="218" x2="278" y2="145" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-cpm-network-critical-path)"/><rect x="10" y="123" width="60" height="44" rx="6" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="2"/><text x="40" y="142" text-anchor="middle" font-weight="700">A</text><text x="40" y="158" text-anchor="middle">3 days</text><rect x="100" y="50" width="60" height="44" rx="6" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="2"/><text x="130" y="69" text-anchor="middle" font-weight="700">B</text><text x="130" y="85" text-anchor="middle">4 days</text><rect x="100" y="196" width="60" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/><text x="130" y="215" text-anchor="middle" font-weight="700">C</text><text x="130" y="231" text-anchor="middle">2 days</text><rect x="190" y="50" width="60" height="44" rx="6" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="2"/><text x="220" y="69" text-anchor="middle" font-weight="700">D</text><text x="220" y="85" text-anchor="middle">2 days</text><rect x="190" y="196" width="60" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/><text x="220" y="215" text-anchor="middle" font-weight="700">E</text><text x="220" y="231" text-anchor="middle">2 days</text><rect x="280" y="123" width="60" height="44" rx="6" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="2"/><text x="310" y="142" text-anchor="middle" font-weight="700">F</text><text x="310" y="158" text-anchor="middle">3 days</text><text x="175" y="270" text-anchor="middle">A–C–E–F = 10 days</text><text x="175" y="286" text-anchor="middle">so C and E have 2 days of float</text></svg>