<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" width="100%" role="img" aria-label="Payment application flow" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Payment application flow</title><defs><marker id="a-pay-application-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-pay-application-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><rect x="20" y="14" width="320" height="52" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/><circle cx="46" cy="40" r="13" fill="#c8a24a" fill-opacity="0.4" stroke="#c8a24a" stroke-width="1.5"/><text x="46" y="45" text-anchor="middle" font-weight="700">1</text><text x="70" y="36" text-anchor="start" font-weight="700">Contractor applies</text><text x="70" y="54" text-anchor="start">AIA G702 form with G703 schedule of values</text><line x1="180" y1="66" x2="180" y2="88" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-pay-application-flow)"/><rect x="20" y="90" width="320" height="52" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/><circle cx="46" cy="116" r="13" fill="#c8a24a" fill-opacity="0.4" stroke="#c8a24a" stroke-width="1.5"/><text x="46" y="121" text-anchor="middle" font-weight="700">2</text><text x="70" y="112" text-anchor="start" font-weight="700">Architect certifies</text><text x="70" y="130" text-anchor="start">reviews progress, certifies the amount</text><line x1="180" y1="142" x2="180" y2="164" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-pay-application-flow)"/><rect x="20" y="166" width="320" height="52" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/><circle cx="46" cy="192" r="13" fill="#c8a24a" fill-opacity="0.4" stroke="#c8a24a" stroke-width="1.5"/><text x="46" y="197" text-anchor="middle" font-weight="700">3</text><text x="70" y="188" text-anchor="start" font-weight="700">Owner pays</text><text x="70" y="206" text-anchor="start">pays the certified amount, less retainage</text><line x1="180" y1="218" x2="180" y2="240" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-pay-application-flow)"/><rect x="20" y="242" width="320" height="52" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/><circle cx="46" cy="268" r="13" fill="#c8a24a" fill-opacity="0.4" stroke="#c8a24a" stroke-width="1.5"/><text x="46" y="273" text-anchor="middle" font-weight="700">4</text><text x="70" y="264" text-anchor="start" font-weight="700">Contractor pays others</text><text x="70" y="282" text-anchor="start">subcontractors and suppliers from that payment</text></svg>