<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="100%" role="img" aria-label="Which change instrument? Decision tree" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Which change instrument? Decision tree</title><defs><marker id="a-change-instrument-decision-tree" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-change-instrument-decision-tree" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><rect x="170" y="10" width="180" height="42" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/><text x="260" y="28" text-anchor="middle" font-weight="700">Before the contract</text><text x="260" y="43" text-anchor="middle" font-weight="700">is signed?</text><rect x="170" y="84" width="180" height="42" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/><text x="260" y="102" text-anchor="middle" font-weight="700">Does price or time</text><text x="260" y="117" text-anchor="middle" font-weight="700">change?</text><rect x="170" y="158" width="180" height="42" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/><text x="260" y="176" text-anchor="middle" font-weight="700">Do owner, architect and</text><text x="260" y="191" text-anchor="middle" font-weight="700">contractor agree?</text><rect x="10" y="5" width="130" height="52" rx="6" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="1.5"/><text x="75" y="25" text-anchor="middle" font-weight="700">ADDENDUM</text><text x="75" y="41" text-anchor="middle">changes bid documents</text><rect x="10" y="79" width="130" height="52" rx="6" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="1.5"/><text x="75" y="99" text-anchor="middle" font-weight="700">ASI</text><text x="75" y="115" text-anchor="middle">minor change, no cost</text><rect x="10" y="153" width="130" height="52" rx="6" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="1.5"/><text x="75" y="173" text-anchor="middle" font-weight="700">CHANGE ORDER</text><text x="75" y="189" text-anchor="middle">all three sign</text><rect x="170" y="232" width="180" height="76" rx="6" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="1.5"/><text x="260" y="252" text-anchor="middle" font-weight="700">CONSTRUCTION CHANGE</text><text x="260" y="267" text-anchor="middle" font-weight="700">DIRECTIVE (CCD)</text><text x="260" y="284" text-anchor="middle">owner and architect sign;</text><text x="260" y="299" text-anchor="middle">price settled later</text><line x1="170" y1="31" x2="142" y2="31" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-change-instrument-decision-tree)"/><line x1="170" y1="105" x2="142" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-change-instrument-decision-tree)"/><line x1="170" y1="179" x2="142" y2="179" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-change-instrument-decision-tree)"/><text x="156" y="25" text-anchor="middle">yes</text><text x="156" y="99" text-anchor="middle">no</text><text x="156" y="173" text-anchor="middle">yes</text><line x1="260" y1="52" x2="260" y2="83" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-change-instrument-decision-tree)"/><line x1="260" y1="126" x2="260" y2="157" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-change-instrument-decision-tree)"/><line x1="260" y1="200" x2="260" y2="231" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-change-instrument-decision-tree)"/><text x="272" y="72" text-anchor="start">no</text><text x="272" y="146" text-anchor="start">yes</text><text x="272" y="220" text-anchor="start">no</text><text x="180" y="328" text-anchor="middle">AIA forms: G710 ASI, G701 change order, G714 CCD</text></svg>